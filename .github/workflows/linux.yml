# Builds loom and runs its suite, its allocation-failure sweeps, a minute
# of the stress test and a batch of fuzzer programs in each configuration it
# is checked in before a release: GCC and Clang, Debug and Release, the
# portable sleep instead of the futex, and the address, undefined-behaviour
# and thread sanitizers. Two more jobs build loom as an engine embeds it, without
# exceptions and without the suite, and as a package: installed and found
# with find_package, and added with add_subdirectory.
name: Linux

# dev is where streams land and every push is checked. main moves only to a
# dev commit that already passed here, so it is not checked again. A stream
# runs it only when started by hand (Run workflow on the Actions tab).
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    # The thread sanitizer's fault sweeps alone take about 13 minutes.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc release,          cxx: g++,     type: Release,        fuzz: 1000 }
          - { name: gcc debug,            cxx: g++,     type: Debug,          fuzz: 600 }
          - { name: gcc release no-futex, cxx: g++,     type: Release,        fuzz: 1000, flags: -DLOOM_NO_FUTEX=ON }
          - { name: clang release,        cxx: clang++, type: Release,        fuzz: 1000 }
          - { name: address sanitizer,    cxx: g++,     type: RelWithDebInfo, fuzz: 500,  flags: -DLOOM_SANITIZE=address }
          - { name: ub sanitizer,         cxx: g++,     type: RelWithDebInfo, fuzz: 500,  flags: -DLOOM_SANITIZE=undefined }
          - { name: thread sanitizer,     cxx: g++,     type: RelWithDebInfo, fuzz: 200,  flags: -DLOOM_SANITIZE=thread }
          - { name: thread sanitizer no-futex, cxx: g++, type: RelWithDebInfo, fuzz: 200, flags: -DLOOM_SANITIZE=thread -DLOOM_NO_FUTEX=ON }
    steps:
      - uses: actions/checkout@v5

      # The sanitizers' shadow memory does not fit beside the runner's
      # default address randomisation.
      - name: Reduce address randomisation
        if: contains(matrix.flags, 'LOOM_SANITIZE')
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        run: |
          ${{ matrix.cxx }} --version
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.type }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} ${{ matrix.flags }}

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        env:
          TSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/tsan.supp
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: timeout 20m build/loom_tests

      - name: Allocation failures
        env:
          TSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/tsan.supp
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: timeout 30m build/loom_faults

      - name: Stress
        env:
          TSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/tsan.supp
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: timeout 10m build/loom_stress --seconds 60 --quiet

      # A different batch of seeds on each run, so that pushes add up to a
      # long campaign; a failing seed is printed and reproduces locally with
      # `loom_fuzz --seed S --size N` in the same configuration.
      - name: Fuzz
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          first=$(( ${{ github.run_number }} * ${{ matrix.fuzz }} + 1 ))
          last=$(( first + ${{ matrix.fuzz }} - 1 ))
          timeout 15m python3 tests/fuzz/fuzz.py run build/loom_fuzz --seeds "$first-$last" --grow \
            --jobs "$(nproc)" --timeout 300 --out build/fuzz-out

      - name: Fuzz failures
        if: failure()
        run: for f in build/fuzz-out/fail-*.log; do [ -f "$f" ] && head -c 100000 "$f"; done; true

  embedded:
    name: embedded, no exceptions
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Build loom without exceptions or the suite
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLOOM_BUILD_TESTS=OFF -DCMAKE_CXX_FLAGS=-fno-exceptions
          cmake --build build -j "$(nproc)"

      # The test hooks belong to loom's own test build only.
      - name: Check the library has no test hooks
        run: |
          if nm -C build/libloom.a | grep -q SetTestHook; then
            echo "libloom.a built without the suite still has test hooks"
            exit 1
          fi

      - name: Build and run the no-exceptions checks
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -fno-exceptions -Iinclude \
            tests/no_exceptions.cpp build/libloom.a -pthread -o build/no_exceptions
          build/no_exceptions

  package:
    name: install and find_package
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Build and install loom
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/prefix"
          cmake --build build -j "$(nproc)" --target loom
          cmake --install build

      # The suite links its own copy with the hooks; the installed one has none.
      - name: Check the installed library has no test hooks
        run: |
          if nm -C "$RUNNER_TEMP/prefix/lib/libloom.a" | grep -q SetTestHook; then
            echo "the installed libloom.a has test hooks"
            exit 1
          fi

      - name: Build a program against the installed package
        run: |
          version=$(sed -n 's/^#define LOOM_VERSION_STRING "\(.*\)"/\1/p' include/loom/loom_version.h)
          cmake -S tests/package -B consumer -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/prefix" -DLOOM_EXPECT_VERSION="$version"
          cmake --build consumer
          consumer/loom_package_check

      - name: Build a program that adds loom with add_subdirectory
        run: |
          cmake -S tests/package -B consumer-source -DLOOM_SOURCE_DIR="$GITHUB_WORKSPACE"
          cmake --build consumer-source -j "$(nproc)"
          consumer-source/loom_package_check
