# A release for each version tag (vX.Y.Z): loom built and its suite and a
# short stress run passed on Linux, then published as a GitHub release
# whose notes are the tag's message. GitHub attaches the source archives; a
# program builds loom from source (FetchContent, add_subdirectory, or the
# installed package). An existing tag is released again by running the
# workflow by hand with its name.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to release (vX.Y.Z)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: linux-x86_64
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      # The tag names the version the header sets.
      - name: Check the tag against the version
        run: |
          version=$(sed -n 's/^#define LOOM_VERSION_STRING "\(.*\)"$/\1/p' include/loom/loom_version.h)
          if [ "v$version" != "$TAG" ]; then
            echo "the tag is $TAG, but include/loom/loom_version.h says $version"
            exit 1
          fi

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j "$(nproc)"

      - name: Suite
        run: |
          timeout 20m build/loom_tests
          timeout 10m build/loom_faults
          timeout 5m build/loom_stress --seconds 30 --quiet

      # GitHub shows every line break in release notes, so the tag's message,
      # wrapped for a terminal, has each paragraph and list item joined onto
      # one line first. Code blocks, headings and tables stay as they are.
      - name: Notes from the tag
        env:
          UNWRAP: |
            import re, sys
            out, cur, fence = [], None, False
            for line in sys.stdin.read().replace("\r", "").split("\n"):
                if re.match(r"\s*(```|~~~)", line):
                    fence = not fence
                elif not fence and line.strip() and not re.match(r"\s*(#{1,6}(\s|$)|\||>|<[A-Za-z/!]|(-{3,}|\*{3,}|_{3,}|={3,})\s*$)", line):
                    if cur is not None and not re.match(r"\s*([-*+]|\d+[.)])\s", line) and not out[cur].endswith(("  ", "\\")):
                        out[cur] = out[cur].rstrip() + " " + line.strip()
                    else:
                        out.append(line)
                        cur = len(out) - 1
                    continue
                out.append(line)
                cur = None
            sys.stdout.write("\n".join(out))
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          {
            git tag -l --format='%(contents)' "$TAG" | python3 -c "$UNWRAP"
            echo
            echo "Use it from CMake:"
            echo
            echo '```cmake'
            echo "include(FetchContent)"
            echo "FetchContent_Declare(loom GIT_REPOSITORY https://github.com/odd-fish-society/loom.git GIT_TAG $TAG)"
            echo "FetchContent_MakeAvailable(loom)"
            echo "target_link_libraries(my_program PRIVATE loom::loom)"
            echo '```'
          } > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="loom ${TAG#v}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file notes.md
          else
            gh release create "$TAG" --title "$title" --notes-file notes.md --verify-tag
          fi
